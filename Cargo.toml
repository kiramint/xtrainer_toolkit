[package]
name = "xtrainer_toolkit"
version = "0.1.0"
edition = "2021"
description = "Dobot Xtrainer robot arm control tool - CLI & TUI, no ROS required"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", features = ["crossterm"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
serialport = { version = "4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
